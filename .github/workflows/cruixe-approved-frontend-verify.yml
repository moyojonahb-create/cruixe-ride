name: CruiXe Approved Frontend Verification

on:
  push:
    branches: ['verify/cruixe-approved-ui-*']
    paths:
      - '.github/workflows/cruixe-approved-frontend-verify.yml'
      - 'nonproduction/approved-ride-ui/qa-ci/review/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cruixe-approved-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/heads/verify/cruixe-approved-ui-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_IMAGE: node:22.23.4-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
      REVIEW_PATH: nonproduction/approved-ride-ui/qa-ci/review
    steps:
      - name: Checkout verification payload only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cruixe-approved-frontend-verify.yml
            /nonproduction/approved-ride-ui/qa-ci/review/
      - name: Validate and extract exact approved snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cruixe-source" "$RUNNER_TEMP/cruixe-deps" "$RUNNER_TEMP/cruixe-evidence"
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          review=Path(os.environ['REVIEW_PATH'])
          manifest=json.loads((review/'review-manifest.json').read_text())
          archive=review/'approved-frontend-ci.tgz'
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=manifest['archiveSHA256']: raise SystemExit('Archive SHA mismatch')
          if manifest['nodeImage']!=os.environ['NODE_IMAGE']: raise SystemExit('Unexpected runtime image')
          expected={f['path']:f for f in manifest['files']}
          if len(expected)!=len(manifest['files']): raise SystemExit('Duplicate manifest path')
          target=Path(os.environ['RUNNER_TEMP'])/'cruixe-source'
          seen=set();total=0
          with tarfile.open(archive,'r:gz') as source:
            for member in source:
              p=PurePosixPath(member.name)
              if not member.isfile() or p.is_absolute() or '..' in p.parts or member.name not in expected or member.name in seen: raise SystemExit('Unsafe archive member')
              if any(part.startswith('.env') or part in ('.git','node_modules','.npmrc') for part in p.parts): raise SystemExit('Forbidden snapshot path')
              total+=member.size
              if member.size>32*1024*1024 or total>256*1024*1024: raise SystemExit('Snapshot exceeds size guard')
              data=source.extractfile(member).read()
              if hashlib.sha256(data).hexdigest()!=expected[member.name]['sha256']: raise SystemExit('File SHA mismatch: '+member.name)
              dest=target/member.name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data);seen.add(member.name)
          if seen!=set(expected): raise SystemExit('Missing snapshot files')
          for name in ('package.json','package-lock.json'):
            (Path(os.environ['RUNNER_TEMP'])/'cruixe-deps'/name).write_bytes((target/name).read_bytes())
          (Path(os.environ['RUNNER_TEMP'])/'cruixe-evidence'/'snapshot-verified.json').write_text(json.dumps({'status':'PASS','archiveSHA256':manifest['archiveSHA256'],'files':len(seen)},indent=2))
          PY
      - name: Fetch pinned runtime and locked dependencies without application execution
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$NODE_IMAGE"
          docker image inspect "$NODE_IMAGE" > "$RUNNER_TEMP/cruixe-evidence/runtime-image.json"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --env HOME=/tmp --env npm_config_registry=https://registry.npmjs.org/ \
            --mount "type=bind,src=$RUNNER_TEMP/cruixe-deps,dst=/deps" --workdir /deps \
            "$NODE_IMAGE" npm ci --ignore-scripts --no-audit --no-fund \
            2>&1 | tee "$RUNNER_TEMP/cruixe-evidence/npm-ci.log"
      - name: Run frontend gates with no network or credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none --read-only --cpus 2 --memory 5g --memory-swap 5g --pids-limit 256 \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m --env HOME=/tmp --env CI=true \
            --env "CRUIXE_COMMIT=$GITHUB_SHA" \
            --mount "type=bind,src=$RUNNER_TEMP/cruixe-source,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/cruixe-deps/node_modules,dst=/work/node_modules" \
            --mount "type=bind,src=$RUNNER_TEMP/cruixe-evidence,dst=/evidence" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$REVIEW_PATH/review-manifest.json,dst=/review-manifest.json,readonly" \
            --workdir /work "$NODE_IMAGE" node --max-old-space-size=256 qa-ci/run-remote.mjs \
            2>&1 | tee "$RUNNER_TEMP/cruixe-evidence/remote-run.log"
      - name: Record summary even when a gate fails
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])/'cruixe-evidence';folder.mkdir(exist_ok=True)
          result=folder/'readiness.json'
          if not result.exists():
            result.write_text(json.dumps({'frontendIntegration':'NO-GO','productionRelease':'NO-GO','gates':{k:{'status':'NOT RUN','reason':'Runner setup or dependency installation did not complete'} for k in ['typescript','vitest','eslint','productionBuild','network','source','screenshots','remoteBrowser']},'authenticatedE2E':{'status':'BLOCKED','reason':'No approved staging'}},indent=2))
          baseline=Path(os.environ['RUNNER_TEMP'])/'cruixe-source/qa-ci/historical-edge-baseline'
          if baseline.is_dir():
            target=folder/'historical-edge-baseline';target.mkdir(exist_ok=True)
            for item in baseline.iterdir():
              if item.is_file() and not (target/item.name).exists(): shutil.copyfile(item,target/item.name)
            (target/'SCOPE.txt').write_text('Historical isolated Microsoft Edge screenshots; not a fresh remote browser run.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('## Isolated CruiXe verification\n\n```json\n'+result.read_text()+'\n```\n')
          PY
      - name: Retain logs, build evidence and labelled historical Edge screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cruixe-approved-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cruixe-evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
