    <!-- Leaflet CSS for OpenStreetMap (non-blocking) -->

         so it is no longer fetched from unpkg on every page load. -->

    <!-- Fonts: preconnect + non-blocking stylesheet (was a render-blocking

  <meta name="twitter:image" content="https://cruixe-ride.lovable.app/brand/cruixe-og-image.png">

  <meta name="twitter:title" content="CruiXe - Your ride, your way.">
  <meta property="og:description" content="CruiXe is Zimbabwe&#39;s premier ride-hailing service. Request a ride anywhere in Zimbabwe.">
  <meta name="twitter:description" content="CruiXe is Zimbabwe&#39;s premier ride-hailing service. Request a ride anywhere in Zimbabwe.">
</head>

  <body>
    <style>
      /* Let Safari derive its chrome from the current page, not a fixed pale band. */
      html, body { background: #f2f4f7; }
      html:has(#instant-splash:not([aria-hidden="true"])),
      body:has(#instant-splash:not([aria-hidden="true"])) { background: #ff000d; }
      html:has(#instant-splash-2:not([aria-hidden="true"])),
      body:has(#instant-splash-2:not([aria-hidden="true"])) { background: #f5ece7; }
      .cruixe-launch {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 400ms ease;
      }
      #instant-splash-bg { position: fixed; inset: 0; z-index: 99997; background: #ff000d; }
      #instant-splash { z-index: 99999; background: #ff000d; }
      #instant-splash-2 { z-index: 99998; background: #f5ece7; opacity: 0; pointer-events: none; }
      .cruixe-launch-wordmark { width: min(51.04vw, 204.174px); height: auto; }
      .cruixe-launch-lettering {
        position: relative;
        width: min(87.5vw, 350px, 81dvh);
        aspect-ratio: 350 / 390;
      }
      .cruixe-launch-lettering img { position: absolute; display: block; }
      .cruixe-launch-lets { top: -0.11%; left: -1.68%; width: 99.88%; }
      .cruixe-launch-name { top: 31.49%; left: -0.56%; width: 100.2%; }
      .cruixe-launch-nicely { top: 61.66%; left: 0.7%; width: 99.75%; }
      .cruixe-launch-footer {
        position: absolute;
        bottom: max(5.8%, calc(env(safe-area-inset-bottom) + 8px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
        color: #111;
        font: 300 15px/20px Inter, system-ui, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        .cruixe-launch { transition: none; }
      }
    </style>
    <div id="instant-splash-bg" aria-hidden="true"></div>
    <div id="instant-splash" class="cruixe-launch">
      <img class="cruixe-launch-wordmark" src="/brand/launch/split-ribbon-wordmark.svg" alt="CruiXe" fetchpriority="high" />
      <div class="cruixe-launch-footer">
        <img src="/brand/launch/split-ribbon-white.svg" width="19" height="20" alt="" />
        <span>Proudly Zim</span>
      </div>
    </div>
    <div id="instant-splash-2" class="cruixe-launch" aria-hidden="true">
      <div class="cruixe-launch-lettering" role="img" aria-label="Let’s CruiXe Nicely">
        <img class="cruixe-launch-lets" src="/brand/launch/lets.svg" alt="" />
        <img class="cruixe-launch-name" src="/brand/launch/cruixe.svg" alt="" />
        <img class="cruixe-launch-nicely" src="/brand/launch/nicely.svg" alt="" />
      </div>
      <div class="cruixe-launch-footer">
        <img src="/brand/launch/split-ribbon-red.svg" width="19" height="20" alt="" />
        <span>Proudly Zim</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Wait for app bootstrap before moving from the wordmark to the tagline.
      (function () {
        window.__splashReady = false;
        window.__splashMinDone = false;

        var FIRST_SPLASH_DURATION = 5000;
        var SECOND_SPLASH_DURATION = 3000;
        var secondSplashStarted = false;

        function showSecondSplash() {
          if (secondSplashStarted) return;
          secondSplashStarted = true;
          var first = document.getElementById('instant-splash');
          var second = document.getElementById('instant-splash-2');
          if (!second) return;
          var transitionDuration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 400;
          second.removeAttribute('aria-hidden');
          second.style.opacity = '1';
          if (first) {
            first.setAttribute('aria-hidden', 'true');
            first.style.opacity = '0';
            setTimeout(function () { first.remove(); }, transitionDuration);
          }
          setTimeout(function () {
            var bg = document.getElementById('instant-splash-bg');
            if (bg) bg.remove();
            second.setAttribute('aria-hidden', 'true');
            second.style.opacity = '0';
            setTimeout(function () { second.remove(); }, transitionDuration);
          }, SECOND_SPLASH_DURATION);
        }

        function tryHide() {
          if (!window.__splashReady || !window.__splashMinDone) return;
          showSecondSplash();
        }

        // First splash floor: keeps the logo visible long enough that it
        // never flashes on a fast load, while still letting bootstrap drive
        // the real transition.
        setTimeout(function () {
          window.__splashMinDone = true;
          tryHide();
        }, FIRST_SPLASH_DURATION);

        // React calls window.__dismissSplash() once the bootstrap resolves
        // (or its own timeout elapses and continues with cached data). Still
        // gated by the five-second floor above so it never cuts the splash short.
        window.__dismissSplash = function () {
          window.__splashReady = true;
          tryHide();
        };

        // Hard fallback only — covers React failing to mount or bootstrap
        // never resolving. The real dismiss is data-driven above.
        setTimeout(function () {
          window.__splashMinDone = true;
          window.__splashReady = true;
          tryHide();
        }, 8000);

      })();
    </script>
  </body>
</html>
